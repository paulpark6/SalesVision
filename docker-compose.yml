version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sales-vision-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sales_vision
    ports:
      - "5432:5432"
    volumes:
      - ./docker/data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sales-vision-network

networks:
  sales-vision-network:
    driver: bridge
